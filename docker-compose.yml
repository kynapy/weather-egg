services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: weather_egg_db
      POSTGRES_USER: weather_egg_user
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"

  api:
    build:
      context: ./weather-egg-api
    depends_on:
      - db
      - mqtt
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/weather_egg_db
      SPRING_DATASOURCE_USERNAME: weather_egg_user
      SPRING_DATASOURCE_PASSWORD: change-me
      MQTT_BROKER_URL: tcp://mqtt:1883
      LTA_API_URI: https://datamall2.mytransport.sg/ltaodataservice/v3
      LTA_API_KEY: ${LTA_API_KEY}
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
    command: mvn spring-boot:run
    volumes:
      - ./weather-egg-api:/app
      - m2_cache:/root/.m2
    working_dir: /app
    ports:
      - "8080:8080"

  ui:
    build:
      context: ./weather-egg-ui
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_BACKEND_API_URL: http://localhost:8080
      NEXT_PUBLIC_DATAMALL_API: https://datamall2.mytransport.sg/ltaodataservice/v3
      NEXT_PUBLIC_DATAMALL_API_KEY: ${NEXT_PUBLIC_DATAMALL_API_KEY}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./weather-egg-ui:/app
      - ui_node_modules:/app/node_modules
    working_dir: /app
    ports:
      - "3000:3000"

volumes:
  pg_data:
  m2_cache:
  ui_node_modules:
